# 실험 7(페일오버) 전용. 단일 노드 스택(docker-compose.yml)과 포트가 겹치지 않는다.
#   docker compose -f docker-compose.cluster.yml up -d
x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

x-rabbit-env: &rabbit-env
  RABBITMQ_ERLANG_COOKIE: mqlabcookie

services:
  kafka1:
    image: apache/kafka:3.9.0
    container_name: mqlab-kafka1
    hostname: kafka1
    ports: ["19092:19092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:19092

  kafka2:
    image: apache/kafka:3.9.0
    container_name: mqlab-kafka2
    hostname: kafka2
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:29092

  kafka3:
    image: apache/kafka:3.9.0
    container_name: mqlab-kafka3
    hostname: kafka3
    ports: ["39092:39092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:39092

  rabbit1:
    image: rabbitmq:3.13-management
    container_name: mqlab-rabbit1
    hostname: rabbit1
    ports: ["5682:5672", "15682:15672"]
    environment: *rabbit-env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbit2:
    image: rabbitmq:3.13-management
    container_name: mqlab-rabbit2
    hostname: rabbit2
    ports: ["5683:5672"]
    environment: *rabbit-env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbit3:
    image: rabbitmq:3.13-management
    container_name: mqlab-rabbit3
    hostname: rabbit3
    ports: ["5684:5672"]
    environment: *rabbit-env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
