server:
  port: 8080

spring:
  application:
    name: rabbitmq-vs-kafka-lab
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

lab:
  cluster:
    # 실험 7(페일오버) 전용 3노드 클러스터. docker-compose.cluster.yml 로 띄운다.
    kafka-bootstrap: localhost:19092,localhost:29092,localhost:39092
    rabbit-host: localhost
    rabbit-ports: 5682,5683,5684

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.springframework.amqp: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-22logger{0} %msg%n"
